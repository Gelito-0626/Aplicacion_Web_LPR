<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema LPR - Registro de Personal</title>
    
    <link rel="stylesheet" href="css/reg-estilos.css">
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="reg-contenedor-principal">
        <div class="reg-tarjeta">
            
            <div class="reg-encabezado reg-anim-1">
                <div class="reg-icono-patria">
                    <i data-lucide="user-plus" class="reg-icono-registro"></i>
                </div>
                <h1 class="reg-titulo">REGISTRO DE PERSONAL MILITAR</h1>
                <p class="reg-subtitulo">Alta de Usuario Autorizado - UNEFA</p>
            </div>

            <div id="reg-alerta-error" class="reg-alerta-error reg-oculto">
                <i data-lucide="alert-triangle" class="reg-icono-alerta"></i>
                <span id="reg-texto-error">Las contraseñas no coinciden.</span>
            </div>

            <form id="reg-formulario" novalidate>
                <div class="reg-grupo-campo reg-anim-2">
                    <label class="reg-label">Nombre Completo</label>
                    <div class="reg-input-contenedor">
                        <i data-lucide="user" class="reg-icono-input"></i>
                        <input type="text" id="reg-nombre" class="reg-input" placeholder="Ej. Juan Carlos Pérez" required>
                        <span class="reg-linea-activa"></span>
                    </div>
                </div>

                <div class="reg-fila-doble reg-anim-3">
                    <div class="reg-grupo-campo">
                        <label class="reg-label">Correo Institucional</label>
                        <div class="reg-input-contenedor">
                            <i data-lucide="mail" class="reg-icono-input"></i>
                            <input type="email" id="reg-correo" class="reg-input" placeholder="usuario@unefa.edu.ve" required>
                            <span class="reg-linea-activa"></span>
                        </div>
                    </div>
                    <div class="reg-grupo-campo">
                        <label class="reg-label">N° Carnet Militar</label>
                        <div class="reg-input-contenedor">
                            <i data-lucide="id-card" class="reg-icono-input"></i>
                            <input type="text" id="reg-carnet" class="reg-input" placeholder="Ej. RE-10293" required>
                            <span class="reg-linea-activa"></span>
                        </div>
                    </div>
                </div>

                <div class="reg-grupo-campo reg-anim-4">
                    <label class="reg-label">Rango / Componente</label>
                    <div class="reg-input-contenedor">
                        <i data-lucide="award" class="reg-icono-input"></i>
                        <select id="reg-rango" class="reg-input-select" required>
                            <option value="" disabled selected>Seleccione su rango...</option>
                            <option value="oficial">Oficial Superior</option>
                            <option value="suboficial">Suboficial</option>
                            <option value="tropa">Tropa Profesional</option>
                            <option value="seguridad">Personal de Seguridad / Guardia</option>
                        </select>
                        <span class="reg-linea-activa"></span>
                    </div>
                </div>

                <div class="reg-fila-doble reg-anim-5">
                    <div class="reg-grupo-campo">
                        <label class="reg-label">Contraseña</label>
                        <div class="reg-input-contenedor">
                            <i data-lucide="lock" class="reg-icono-input"></i>
                            <input type="password" id="reg-clave" class="reg-input" placeholder="••••••••" required>
                            <span class="reg-linea-activa"></span>
                        </div>
                    </div>
                    <div class="reg-grupo-campo">
                        <label class="reg-label">Confirmar Contraseña</label>
                        <div class="reg-input-contenedor">
                            <i data-lucide="shield-check" class="reg-icono-input"></i>
                            <input type="password" id="reg-confirmar" class="reg-input" placeholder="••••••••" required>
                            <span class="reg-linea-activa"></span>
                        </div>
                    </div>
                </div>

                <div class="reg-anim-6" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                    <button type="submit" class="reg-boton reg-boton-registrar">REGISTRAR EN EL SISTEMA</button>
                    
                    <div class="reg-fila-botones-secundarios">
                        <button type="button" id="reg-btn-limpiar" class="reg-boton reg-boton-limpiar">LIMPIAR</button>
                        <a href="login.html" class="reg-boton reg-boton-volver">VOLVER AL LOGIN</a>
                    </div>
                </div>
            </form>

            <div class="reg-pie reg-anim-7">
                <p>REPÚBLICA BOLIVARIANA DE VENEZUELA — FUERZA ARMADA NACIONAL BOLIVARIANA</p>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="js/registro.js"></script>
</body>
</html>
