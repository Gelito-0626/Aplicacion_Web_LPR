name: CD - Despliegue Continuo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [closed]

jobs:
  test-and-build:
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🔨 Construir imagen Docker
        run: docker build -t aegis-lpr .

      - name: 🏥 Verificar health check
        run: |
          docker run -d -p 8000:8000 --name aegis-test aegis-lpr
          echo "Esperando inicio..."
          sleep 8
          echo "Verificando health..."
          curl -f http://localhost:8000/health || (docker logs aegis-test && exit 1)
          docker stop aegis-test

      - name: 🐳 Login a Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 📤 Push a Docker Hub
        if: success()
        run: |
          docker tag aegis-lpr ${{ secrets.DOCKER_USERNAME }}/aegis-lpr:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/aegis-lpr:latest

      - name: 🚀 Desplegar en Render
        if: success()
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"