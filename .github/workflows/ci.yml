name: CI - Sistema LPR

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-spa || true

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy pydantic requests python-multipart watchfiles
          pip install 'pydantic[email]'
          pip install opencv-python-headless ultralytics pytesseract pillow
          pip install pytest httpx

      - name: Ejecutar pruebas unitarias
        run: |
          pytest test_main.py -v