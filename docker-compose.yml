version: '3.8'

services:
  aegis-lpr:
    build: .
    container_name: aegis-lpr
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/lpr.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s